# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Build performance: parallel module execution and a local build cache.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is the only support library stack used by Nivara.
android.useAndroidX=true

# Each module only gets R class entries for its own resources (smaller, faster builds).
android.nonTransitiveRClass=true

# Kotlin: official formatting style, no experimental language features.
kotlin.code.style=official
